<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="bootstrap.min.css" rel="stylesheet">

    <title>%DEV_NAME% - Reset Configuration</title>
    <style>
        body { background: #f0f2f5; }
        .card { border: none; border-radius: .75rem; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
        .card-header { background: #212529; color: #fff; border-radius: .75rem .75rem 0 0 !important; letter-spacing: .02em; }
    </style>
</head>

<body class="d-flex flex-column vh-100">
    <main class="flex-shrink-0">

        %NAVBAR%

        <!-- Reset Config -->
        <div class="card col-lg-6 mx-auto mb-5">
            <h5 class="card-header">Reset Configuration</h5>
            <div class="card-body text-center py-4">
                <div class="text-warning mb-2" style="font-size:2.5rem">&#9888;</div>
                <p class="text-muted mb-1">Settings have been reset.</p>
                <p class="text-muted mb-3 small">Connect to <strong>%DEV_NAME%</strong>'s AP, then visit the <a href="http://4.3.2.1">CAPTIVE Portal</a></p>
                <button type="button" onclick="location.href='/'" class="btn btn-primary">Home</button>
            </div>
        </div>
    </main>
    
    %FOOTER%

    <script src="bootstrap.min.js"></script>
</body>

</html>
