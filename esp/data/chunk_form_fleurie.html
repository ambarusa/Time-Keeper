<!-- Fleurie specific -->
<div class="form-check mb-3">
    <input class="form-check-input" type="radio" name="light_mode" id="light_automatic">
    <label class="form-check-label" for="light_automatic">Automatic</label>
</div>
<div class="form-check mb-3">
    <input class="form-check-input" type="radio" name="light_mode" id="light_manual">
    <label class="form-check-label" for="light_manual">Manual</label>
</div>
<div class="d-flex align-items-center gap-2 mt-2">
    <label class="form-label mb-0" for="brightness">Brightness</label>
    <input type="range" class="form-range flex-grow-1" id="brightness" min="3" max="100" step="1">
    <span class="badge bg-secondary text-center" id="brightness_val" style="min-width:3rem">--</span>
</div>
