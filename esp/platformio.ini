[env]
platform = espressif8266
board = esp12e
board_build.filesystem = littlefs
framework = arduino
upload_speed = 921600
extra_scripts = pre:pre_script.py
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    marvinroger/async-mqtt-client@^0.9.0
    me-no-dev/ESPAsyncTCP@^1.2.2
    me-no-dev/ESPAsyncWebServer@^3.1.0
    arduino-libraries/NTPClient@^3.2.1

[env:esp_fleurie]
extra_scripts = 
    pre:pre_script.py
    post:post_script.py
build_flags = -D FLEURIE

[env:esp_pixie]
extra_scripts = 
    pre:pre_script.py
    post:post_script.py
build_flags = -D PIXIE

[env:esp32_fleurie]
platform = espressif32
board = esp32dev
board_build.filesystem = littlefs
framework = arduino
upload_speed = 921600
extra_scripts = pre:pre_script.py
build_flags = -D FLEURIE -D ESP32
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    marvinroger/async-mqtt-client@^0.9.0
    me-no-dev/AsyncTCP@^3.1.0
    me-no-dev/ESPAsyncWebServer@^3.1.0
    arduino-libraries/NTPClient@^3.2.1

[env:esp32_pixie]
platform = espressif32
board = esp32dev
board_build.filesystem = littlefs
framework = arduino
upload_speed = 921600
extra_scripts = pre:pre_script.py
build_flags = -D PIXIE -D ESP32
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    marvinroger/async-mqtt-client@^0.9.0
    me-no-dev/AsyncTCP@^3.1.0
    me-no-dev/ESPAsyncWebServer@^3.1.0
    arduino-libraries/NTPClient@^3.2.1

