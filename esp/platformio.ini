[env:esp_fleurie_debug]
platform = ${esp8266.platform}
board = ${esp8266.board}
lib_deps = ${esp8266.lib_deps}
monitor_speed  = 115200
build_flags = -D FLEURIE -D DEBUG

[env:esp_pixie_debug]
platform = ${esp8266.platform}
board = ${esp8266.board}
lib_deps = ${esp8266.lib_deps}
monitor_speed  = 115200
build_flags = -D PIXIE -D DEBUG

[env:esp32_fleurie_debug]
platform = ${esp32.platform}
board = ${esp32.board}
lib_deps = ${esp32.lib_deps}
monitor_speed  = 115200
extra_scripts = ${release.extra_scripts}
build_flags = -D FLEURIE -D ESP32 -D DEBUG

[env:esp32_pixie_debug]
platform = ${esp32.platform}
board = ${esp32.board}
lib_deps = ${esp32.lib_deps}
monitor_speed  = 115200
extra_scripts = ${release.extra_scripts}
build_flags = -D PIXIE -D ESP32 -D DEBUG